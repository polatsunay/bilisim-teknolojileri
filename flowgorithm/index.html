<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AkışLab · sunays.school</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4fa;--panel:#fff;--line:#e2e5ef;--ink:#1d2135;--mut:#6b7185;--acc:#5b5bd6;--acc2:#0ea5a4;--hd:#191c36}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg)}
body{display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit}
header{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--hd);color:#fff;flex-wrap:wrap;row-gap:6px}
.brand{display:flex;align-items:center;gap:9px;margin-right:6px}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.4px;display:block;line-height:1.1}
.brand b i{font-style:normal;color:#8b8cff}
.brand small{display:block;font-size:10.5px;opacity:.65;font-weight:500}
.tb{display:flex;gap:4px;align-items:center;padding:0 6px;border-left:1px solid rgba(255,255,255,.12)}
.tb button{background:rgba(255,255,255,.08);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-weight:600;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tb button:hover:not(:disabled){background:rgba(255,255,255,.2)}
.tb button:disabled{opacity:.35;cursor:default}
.tb button.run{background:#16a34a}.tb button.run:hover:not(:disabled){background:#12853c}
.tb button.stop{background:#dc2626}.tb button.stop:hover:not(:disabled){background:#b91c1c}
.tb label{font-size:11px;opacity:.75;display:flex;align-items:center;gap:6px}
.tb input[type=range]{width:80px;accent-color:#8b8cff}
#zl{font-size:12px;min-width:40px;text-align:center;opacity:.85}
#main{flex:1;display:flex;min-height:0}
#left{flex:1;display:flex;flex-direction:column;min-width:0}
#fnbar{display:flex;gap:4px;padding:6px 10px 0;align-items:flex-end;flex-wrap:wrap}
.ftab{padding:7px 14px;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;background:#e6e8f2;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;color:#444a63}
.ftab.on{background:#fff;color:var(--acc)}
.ftab.add{background:transparent;border-style:dashed;color:var(--mut)}
.ftab.add:hover{color:var(--acc);border-color:var(--acc)}
#selbar{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:12px;color:var(--mut);padding-bottom:5px}
#selbar button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 8px;font-size:12px;cursor:pointer;font-weight:600;color:#333}
#selbar button:hover{border-color:var(--acc);color:var(--acc)}
#pname{border:1px solid transparent;background:transparent;font:700 13px Inter;color:#444a63;padding:4px 6px;border-radius:6px;width:170px}
#pname:hover,#pname:focus{border-color:var(--line);background:#fff;outline:none}
#canvasWrap{flex:1;overflow:auto;background:#fff;background-image:radial-gradient(#dde1ec 1px,transparent 1px);background-size:18px 18px;border-top:1px solid var(--line);position:relative}
#canvas{padding:16px 20px 40px;min-width:100%;width:max-content}
#canvas svg{display:block;margin:0 auto;user-select:none}
#hint{font-size:11.5px;color:var(--mut);padding:5px 12px;border-top:1px solid var(--line);background:#fafbfe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint b{color:#444a63}
.conn{cursor:pointer}
.conn:hover .plus{opacity:1}
.conn:hover .cl{stroke:#5b5bd6}
.node{cursor:pointer}
.node:hover .shp{filter:brightness(.96)}
.term{cursor:pointer}
.node.sel .shp{stroke:#2563eb;stroke-width:3.5}
.node.active .shp{stroke:#f59e0b;stroke-width:4.5;filter:drop-shadow(0 0 7px rgba(245,158,11,.9))}
.node.err .shp{stroke:#dc2626;stroke-width:4.5;filter:drop-shadow(0 0 7px rgba(220,38,38,.8))}
aside{width:390px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fafbfe}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;font-weight:600;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);background:#fff}
.pane{display:none;flex:1;min-height:0;flex-direction:column}
.pane.on{display:flex}
#con{flex:1;overflow:auto;padding:12px;background:#f7f8fc;display:flex;flex-direction:column;gap:6px;min-height:120px}
.msg{max-width:85%;padding:7px 11px;border-radius:12px;font:14px 'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-word}
.msg.out{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px}
.msg.in{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.msg.sys{align-self:center;background:transparent;color:var(--mut);font:600 11.5px Inter;padding:2px}
.msg.err{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;align-self:stretch;max-width:100%;font:500 13px Inter}
.msg.ok{background:#dcfce7;border:1px solid #86efac;color:#166534;align-self:stretch;max-width:100%;font:600 13px Inter}
#inbar{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);align-items:center}
#inlbl{font:600 12px 'JetBrains Mono',monospace;color:var(--acc);white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
#inp{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font:14px 'JetBrains Mono',monospace}
#inp:focus{outline:none;border-color:var(--acc)}
#inp:disabled{background:#f3f4f8}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.pri:hover{background:#4848c4;color:#fff}
.btn.danger{color:#dc2626}.btn.danger:hover{border-color:#dc2626}
.btn:disabled{opacity:.4;cursor:default}
.vhead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 6px;border-top:1px solid var(--line);font-weight:700;font-size:13px}
.vhead small{font-weight:500;color:var(--mut)}
#vars{height:210px;overflow:auto;padding:0 8px 8px}
#vars table{width:100%;border-collapse:collapse;font-size:13px}
#vars th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:5px 6px;position:sticky;top:0;background:#fff}
#vars td{padding:5px 6px;border-top:1px solid #eef0f6;font-family:'JetBrains Mono',monospace;font-size:13px;word-break:break-all}
#vars td.ty{font-family:Inter;color:var(--mut);font-size:12px;white-space:nowrap}
#vars tr.chg td{background:#fff7d6;transition:background .2s}
.empty{color:var(--mut);font-size:13px;padding:14px 6px;text-align:center}
.codebar{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line);align-items:center}
.codebar select{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px;font:600 13px Inter}
#code{flex:1;overflow:auto;margin:0;padding:12px 14px;font:13px/1.55 'JetBrains Mono',monospace;background:#1b1e33;color:#e5e7f5;white-space:pre;tab-size:4}
#code .k{color:#c4a7ff;font-weight:600}#code .s{color:#9be59b}#code .c{color:#7d84a6;font-style:italic}#code .n{color:#ffcf7a}
.scroll{flex:1;overflow:auto;padding:12px}
.task{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.task:hover{border-color:var(--acc)}
.task.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,91,214,.15)}
.task h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.task h4 .lv{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:#eef;color:var(--acc)}
.task h4 .done{margin-left:auto;color:#16a34a;font-size:15px}
.task .tb2{display:none;margin-top:8px;font-size:13px;line-height:1.5;color:#3b4058}
.task.on .tb2{display:block}
.task .hintx{background:#f6f7fc;border-radius:8px;padding:6px 9px;margin:6px 0;font-size:12.5px;color:var(--mut)}
.tres{margin-top:8px;font-size:12.5px}
.tres div{padding:6px 8px;border-radius:7px;margin-bottom:4px}
.tres .p{background:#dcfce7;color:#166534}.tres .f{background:#fee2e2;color:#991b1b}
.prog{height:8px;background:#eceef6;border-radius:9px;overflow:hidden;margin:4px 0 12px}
.prog div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.help h3{font-size:14px;margin:16px 0 6px}
.help h3:first-child{margin-top:0}
.help p,.help li{font-size:13px;line-height:1.55;color:#3b4058}
.help table{width:100%;border-collapse:collapse;font-size:12.5px}
.help td{padding:5px 6px;border-top:1px solid #eef0f6;vertical-align:top}
.help code{font-family:'JetBrains Mono',monospace;background:#f1f2f8;padding:1px 5px;border-radius:5px;font-size:12px}
#menu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(20,22,50,.2);padding:10px;display:none;width:300px}
#menu.on{display:block}
#menu h5{margin:4px 4px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
#menu .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
#menu button{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:#f6f7fc;border-radius:9px;padding:7px 8px;font-size:13px;font-weight:600;cursor:pointer;text-align:left;color:var(--ink)}
#menu button:hover{border-color:var(--acc);background:#fff}
#menu button svg{flex:none}
#modal{position:fixed;inset:0;background:rgba(16,18,40,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal.on{display:flex}
.dlg{background:#fff;border-radius:16px;width:min(520px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden}
.dh{padding:14px 18px;border-bottom:1px solid rgba(0,0,0,.08)}
.dh b{font-size:17px;display:block}
.dh span{font-size:12.5px;color:#4b5068;display:block;margin-top:4px;line-height:1.45}
.db{padding:14px 18px;overflow:auto}
.df{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fafbfe}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#3b4058}
.fld input[type=text],.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;font:14px 'JetBrains Mono',monospace;color:var(--ink);background:#fff}
.fld textarea{font-family:Inter;min-height:70px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--acc)}
.fld small{display:block;color:var(--mut);font-size:11.5px;margin-top:4px;line-height:1.4}
.row{display:flex;gap:10px}
.row>*{flex:1}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;cursor:pointer}
.derr{color:#dc2626;font-size:13px;font-weight:600;min-height:4px}
.prow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.prow input[type=text]{flex:1}
.prow select{width:120px!important}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#1d2135;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.dd{position:relative}
.ddm{position:absolute;top:calc(100% + 6px);left:0;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.25);padding:6px;display:none;z-index:40;min-width:260px}
.ddm.on{display:block}
.ddm button{display:block;width:100%;text-align:left;background:transparent!important;color:var(--ink)!important;padding:8px 10px!important;border-radius:8px!important;font-weight:600}
.ddm button:hover{background:#f1f2fb!important}
.ddm button small{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
@media(max-width:960px){
  #main{flex-direction:column}
  aside{width:100%;height:46%;border-left:0;border-top:1px solid var(--line)}
  .tb button span.t{display:none}
  #vars{height:140px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34"><rect x="9" y="2" width="16" height="7" rx="3.5" fill="#8b8cff"/><path d="M17 9v4" stroke="#fff" stroke-width="2"/><path d="M17 13l7 5-7 5-7-5z" fill="#f472b6"/><path d="M10 18H5v9h7M24 18h5v9h-7" stroke="#fff" stroke-width="2" fill="none"/><rect x="11" y="24" width="12" height="7" rx="2" fill="#34d399"/></svg>
    <div><b>Akış<i>Lab</i></b><small>sunays.school · Algoritma &amp; Akış Diyagramı</small></div>
  </div>
  <div class="tb">
    <button id="bNew" title="Yeni program">📄<span class="t">Yeni</span></button>
    <button id="bOpen" title="Flowgorithm (.fprg) dosyası aç">📂<span class="t">Aç</span></button>
    <button id="bSave" title="Flowgorithm (.fprg) olarak kaydet">💾<span class="t">Kaydet</span></button>
    <button id="bPng" title="Diyagramı resim olarak indir">🖼️<span class="t">PNG</span></button>
    <div class="dd"><button id="bEx">📚<span class="t">Örnekler ▾</span></button><div class="ddm" id="exMenu"></div></div>
  </div>
  <div class="tb">
    <button id="bUndo" title="Geri al (Ctrl+Z)">↶</button>
    <button id="bRedo" title="Yinele (Ctrl+Y)">↷</button>
  </div>
  <div class="tb">
    <button id="bRun" class="run" title="Çalıştır (F5)">▶<span class="t">Çalıştır</span></button>
    <button id="bStep" title="Adım adım çalıştır (F10)">⏭<span class="t">Adım</span></button>
    <button id="bPause" title="Duraklat">⏸</button>
    <button id="bStop" class="stop" title="Durdur">⏹</button>
    <label>Hız<input type="range" id="speed" min="1" max="10" value="6"></label>
  </div>
  <div class="tb">
    <button id="bZo" title="Uzaklaştır">−</button><span id="zl">100%</span><button id="bZi" title="Yakınlaştır">+</button>
  </div>
</header>
<div id="main">
  <section id="left">
    <div id="fnbar"></div>
    <div id="canvasWrap"><div id="canvas"></div></div>
    <div id="hint">💡 <b>Oklara</b> tıklayarak şekil ekleyin · Şekle <b>çift tıklayarak</b> düzenleyin · <b>Del</b> sil · <b>Ctrl+C / Ctrl+V</b> kopyala-yapıştır · <b>Ctrl+Z</b> geri al</div>
  </section>
  <aside>
    <div class="tabs">
      <button data-p="pCon" class="on">Konsol</button>
      <button data-p="pCode">Kod</button>
      <button data-p="pTask">Görevler</button>
      <button data-p="pHelp">Yardım</button>
    </div>
    <div class="pane on" id="pCon">
      <div id="con"><div class="msg sys">Programı çalıştırmak için ▶ Çalıştır'a basın</div></div>
      <form id="inbar"><span id="inlbl"></span><input id="inp" disabled placeholder="Girdi bekleniyor…" autocomplete="off"><button class="btn pri" id="inBtn" disabled>Gönder</button></form>
      <div class="vhead">Değişkenler <small id="stack"></small></div>
      <div id="vars"><div class="empty">Program çalışırken değişkenler burada görünür.</div></div>
    </div>
    <div class="pane" id="pCode">
      <div class="codebar">
        <select id="codeSel">
          <option value="steps">Adım adım algoritma (Türkçe)</option>
          <option value="pseudo">Sözde kod (Türkçe)</option>
          <option value="py">Python</option>
          <option value="js">JavaScript</option>
        </select>
        <button class="btn" id="bCopy">Kopyala</button>
      </div>
      <pre id="code"></pre>
    </div>
    <div class="pane" id="pTask"><div class="scroll" id="tasks"></div></div>
    <div class="pane" id="pHelp"><div class="scroll help" id="help"></div></div>
  </aside>
</div>
<div id="menu"></div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="file" accept=".fprg,.xml,.txt" style="display:none">

<script>
"use strict";
/* ================= Yardımcılar ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const TYPES=['Integer','Real','String','Boolean'];
const TTR={Integer:'Tamsayı',Real:'Ondalık',String:'Metin',Boolean:'Mantıksal',None:'Yok'};
const COL={
  declare:{f:'#FFF3B0',s:'#C9A000'}, assign:{f:'#FFDDB3',s:'#D9822B'},
  input:{f:'#CFE6FF',s:'#3B82F6'}, output:{f:'#D2F4D9',s:'#1FA45A'},
  if:{f:'#FFD3E0',s:'#DB2777'}, while:{f:'#E7DBFF',s:'#7C3AED'}, for:{f:'#E7DBFF',s:'#7C3AED'}, do:{f:'#E7DBFF',s:'#7C3AED'},
  call:{f:'#C9F2EF',s:'#0D9488'}, comment:{f:'#F2F3F7',s:'#9CA3AF'}, term:{f:'#E6E7FF',s:'#5B5BD6'}
};
const NAMES={declare:'Tanımla',assign:'Ata',input:'Girdi',output:'Çıktı',if:'Eğer',while:'While döngüsü',for:'For döngüsü',do:'Do döngüsü',call:'Çağır',comment:'Yorum'};
const DESC={
  declare:'Tanımla şekli programda kullanılacak değişkenleri oluşturur. Birden fazla değişkeni virgülle ayırabilirsiniz (ör. a, b, toplam).',
  assign:'Ata şekli sağdaki ifadeyi hesaplar ve sonucu soldaki değişkende saklar.',
  input:'Girdi şekli kullanıcıdan (klavyeden) bir değer okur ve değişkene yerleştirir.',
  output:'Çıktı şekli bir ifadenin değerini ekrana yazdırır. Metin ve değerleri & ile birleştirebilirsiniz.',
  if:'Eğer şekli bir koşulu kontrol eder. Koşul doğruysa sağdaki (Doğru), yanlışsa soldaki (Yanlış) yol izlenir.',
  while:'While döngüsü koşul doğru olduğu sürece içindeki adımları tekrarlar. Koşul her turun başında kontrol edilir.',
  for:'For döngüsü bir sayaç değişkenini başlangıç değerinden bitiş değerine kadar artırarak (veya azaltarak) tekrar eder.',
  do:'Do döngüsü önce içindeki adımları çalıştırır, sonra koşulu kontrol eder. Bu yüzden en az bir kez çalışır.',
  call:'Çağır şekli, kendi oluşturduğunuz bir fonksiyonu çalıştırır.',
  comment:'Yorum şekli çalıştırılmaz; diyagrama açıklama notu eklemek içindir.'
};
let nid=1;
const mctx=document.createElement('canvas').getContext('2d');
function tw(s){mctx.font='600 14px Inter, Arial, sans-serif';return mctx.measureText(s).width}
function clip(s,max){if(tw(s)<=max)return s;while(s.length>1&&tw(s+'…')>max)s=s.slice(0,-1);return s+'…'}
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),ms)}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ================= Program modeli ================= */
function kids(n){return n.t==='if'?[n.then,n.else]:(n.t==='while'||n.t==='for'||n.t==='do')?[n.body]:[]}
function assignIds(list){for(const n of list){n.id=nid++;kids(n).forEach(assignIds)}}
function newNode(t){
  const d={declare:{names:'',type:'Integer',array:false,size:''},assign:{variable:'',expr:''},input:{variable:''},output:{expr:'',newline:true},
    if:{expr:'',then:[],else:[]},while:{expr:'',body:[]},for:{variable:'',start:'1',end:'10',dir:'inc',step:'1',body:[]},do:{expr:'',body:[]},call:{expr:''},comment:{text:''}}[t];
  return Object.assign({t,id:nid++},JSON.parse(JSON.stringify(d)));
}
function emptyProgram(){return {name:'Yeni Program',author:'',functions:[{name:'Main',type:'None',variable:'',params:[],body:[]}]}}
const snap=()=>JSON.stringify(prog,(k,v)=>k==='_s'||k==='id'?undefined:v);
function loadProg(p){prog=p;prog.functions.forEach(f=>{f.params=f.params||[];assignIds(f.body)});curFn=0;selId=null}

/* ================= İfade ayrıştırıcı ================= */
class SynErr extends Error{}
const KW={and:'and',ve:'and',or:'or',veya:'or',not:'not','değil':'not',mod:'%'};
function tokenize(s){
  const T=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue}
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){
      let j=i;while(j<s.length&&/[0-9]/.test(s[j]))j++;let isInt=true;
      if(s[j]==='.'&&/[0-9]/.test(s[j+1]||'')){isInt=false;j++;while(j<s.length&&/[0-9]/.test(s[j]))j++}
      if(/[A-Za-z_]/.test(s[j]||''))throw new SynErr('Sayıdan hemen sonra harf gelemez: "'+s.slice(i,j+1)+'"');
      T.push({t:'num',v:parseFloat(s.slice(i,j)),raw:s.slice(i,j),isInt});i=j;continue}
    if(c==='"'||c==="'"){let j=i+1;while(j<s.length&&s[j]!==c)j++;if(j>=s.length)throw new SynErr('Metin kapanmamış: tırnak işareti ('+c+') eksik.');T.push({t:'str',v:s.slice(i+1,j)});i=j+1;continue}
    if(/[A-Za-z_ÇĞİÖŞÜçğıöşü]/.test(c)){let j=i;while(j<s.length&&/[A-Za-z0-9_ÇĞİÖŞÜçğıöşü]/.test(s[j]))j++;const w=s.slice(i,j);const lw=w.toLowerCase();
      if(KW[lw]||lw==='deği̇l')T.push({t:'op',v:KW[lw]||'not'});else T.push({t:'id',v:w});i=j;continue}
    const two=s.substr(i,2);const M2={'==':'==','!=':'!=','<>':'!=','<=':'<=','>=':'>=','&&':'and','||':'or'};
    if(M2[two]){T.push({t:'op',v:M2[two]});i+=2;continue}
    if('+-*/%^&<>=!(),[]'.includes(c)){T.push({t:'op',v:c==='='?'==':c==='!'?'not':c});i++;continue}
    throw new SynErr('Tanınmayan karakter: "'+c+'"');
  }
  return T;
}
const pcache=new Map();
function parseExpr(src){
  src=String(src??'');
  if(pcache.has(src)){const r=pcache.get(src);if(r instanceof Error)throw r;return r}
  try{const r=parseRaw(src);pcache.set(src,r);return r}catch(e){pcache.set(src,e);throw e}
}
function parseRaw(src){
  const T=tokenize(src);if(!T.length)throw new SynErr('İfade boş olamaz.');
  let p=0;const isOp=v=>T[p]&&T[p].t==='op'&&T[p].v===v;
  const expect=v=>{if(!isOp(v))throw new SynErr('"'+v+'" bekleniyordu'+(T[p]?' ama "'+(T[p].raw??T[p].v)+'" bulundu.':' ama ifade bitti.'));p++};
  function or(){let a=and();while(isOp('or')){p++;a={k:'bin',op:'or',a,b:and()}}return a}
  function and(){let a=not();while(isOp('and')){p++;a={k:'bin',op:'and',a,b:not()}}return a}
  function not(){if(isOp('not')){p++;return{k:'un',op:'not',a:not()}}return cmp()}
  function cmp(){let a=cat();for(const o of['==','!=','<','>','<=','>=']){if(isOp(o)){p++;return{k:'bin',op:o,a,b:cat()}}}return a}
  function cat(){let a=add();while(isOp('&')){p++;a={k:'bin',op:'&',a,b:add()}}return a}
  function add(){let a=mul();while(isOp('+')||isOp('-')){const o=T[p++].v;a={k:'bin',op:o,a,b:mul()}}return a}
  function mul(){let a=un();while(isOp('*')||isOp('/')||isOp('%')){const o=T[p++].v;a={k:'bin',op:o,a,b:un()}}return a}
  function un(){if(isOp('-')){p++;return{k:'un',op:'-',a:un()}}if(isOp('+')){p++;return un()}if(isOp('not')){p++;return{k:'un',op:'not',a:un()}}return pow()}
  function pow(){const a=prim();if(isOp('^')){p++;return{k:'bin',op:'^',a,b:un()}}return a}
  function prim(){
    const t=T[p];if(!t)throw new SynErr('İfade beklenmedik şekilde bitti.');
    if(t.t==='num'){p++;return{k:'num',v:t.v,raw:t.raw,isInt:t.isInt}}
    if(t.t==='str'){p++;return{k:'str',v:t.v}}
    if(t.t==='id'){p++;const l=t.v.toLowerCase();
      if(isOp('(')){p++;const args=[];if(!isOp(')')){args.push(or());while(isOp(',')){p++;args.push(or())}}expect(')');return{k:'call',name:t.v,args}}
      if(isOp('[')){p++;const index=or();expect(']');return{k:'idx',name:t.v,index}}
      if(l==='true'||l==='doğru')return{k:'bool',v:true};
      if(l==='false'||l==='yanlış')return{k:'bool',v:false};
      if(l==='pi')return{k:'pi'};
      return{k:'id',name:t.v}}
    if(isOp('(')){p++;const e=or();expect(')');return{k:'par',a:e}}
    throw new SynErr('Beklenmeyen simge: "'+t.v+'"');
  }
  const r=or();if(p<T.length)throw new SynErr('Fazladan simge: "'+(T[p].raw??T[p].v)+'". Operatör eksik olabilir.');
  return r;
}
const IDRE=/^[A-Za-z_ÇĞİÖŞÜçğıöşü][A-Za-z0-9_ÇĞİÖŞÜçğıöşü]*$/;
const RESERVED=['and','or','not','mod','true','false','pi','ve','veya','doğru','yanlış'];
function chkExpr(s){try{parseExpr(s);return null}catch(e){return e.message}}
function chkTarget(s){if(!s.trim())return 'Değişken adı boş olamaz.';try{const a=parseExpr(s);if(a.k!=='id'&&a.k!=='idx')return 'Buraya bir değişken adı (ör. x veya dizi[i]) yazılmalı.';return null}catch(e){return e.message}}
function chkName(s){if(!IDRE.test(s))return '"'+s+'" geçerli bir ad değil. Harfle başlamalı; boşluk ve özel karakter içermemeli.';if(RESERVED.includes(s.toLowerCase()))return '"'+s+'" ayrılmış bir sözcük, değişken adı olamaz.';return null}
const splitNames=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);

/* ================= Yorumlayıcı ================= */
class RunError extends Error{constructor(m,node){super(m);this.node=node}}
const RE=m=>new RunError(m);
function typeName(v){if(v===undefined)return 'değersiz';if(Array.isArray(v))return 'Dizi';if(typeof v==='number')return Number.isInteger(v)?'Tamsayı':'Ondalık';if(typeof v==='string')return 'Metin';if(typeof v==='boolean')return 'Mantıksal';return '?'}

const needS=(f,x)=>{if(typeof x!=='string')throw RE(f+' fonksiyonu Metin bekler, '+typeName(x)+' verildi.')};

  abs:[1,x=>(needN('Abs',x),Math.abs(x))], sqrt:[1,x=>{needN('Sqrt',x);if(x<0)throw RE('Negatif sayının karekökü alınamaz.');return Math.sqrt(x)}],
  sin:[1,x=>(needN('Sin',x),Math.sin(x))], cos:[1,x=>(needN('Cos',x),Math.cos(x))], tan:[1,x=>(needN('Tan',x),Math.tan(x))],
  arcsin:[1,x=>(needN('ArcSin',x),Math.asin(x))], arccos:[1,x=>(needN('ArcCos',x),Math.acos(x))], arctan:[1,x=>(needN('ArcTan',x),Math.atan(x))],
  int:[1,x=>(needN('Int',x),Math.trunc(x))], ln:[1,x=>(needN('Ln',x),Math.log(x))], log:[1,x=>(needN('Log',x),Math.log(x))], log10:[1,x=>(needN('Log10',x),Math.log10(x))],
  sgn:[1,x=>(needN('Sgn',x),Math.sign(x))],
  random:[1,x=>{needN('Random',x);if(x<1)throw RE('Random(n) için n en az 1 olmalı.');return Math.floor(Math.random()*Math.trunc(x))}],
  len:[1,x=>(needS('Len',x),x.length)],
  char:[2,(s,i)=>{needS('Char',s);needN('Char',i);if(i<0||i>=s.length)throw RE('Char: '+i+' konumu metnin dışında (uzunluk '+s.length+').');return s[i]}],
  tochar:[1,x=>(needN('ToChar',x),String.fromCharCode(x))], tocode:[1,x=>{needS('ToCode',x);if(!x.length)throw RE('ToCode: metin boş.');return x.charCodeAt(0)}],
  tofixed:[2,(r,d)=>(needN('ToFixed',r,d),r.toFixed(Math.max(0,Math.min(20,d))))],
  tointeger:[1,x=>{if(typeof x==='number')return Math.trunc(x);const s=String(x).trim();if(!/^[-+]?\d+$/.test(s))throw RE('"'+x+'" tamsayıya çevrilemez.');return parseInt(s,10)}],
  toreal:[1,x=>{if(typeof x==='number')return x;const s=String(x).trim().replace(',','.');if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))throw RE('"'+x+'" ondalık sayıya çevrilemez.');return parseFloat(s)}],
  tostring:[1,x=>fmt(x)],
  size:[1,x=>{if(!Array.isArray(x))throw RE('Size fonksiyonu bir dizi bekler.');return x.length}]
};
function coerce(v,type,name){
  if(v===undefined)throw RE('Atanacak bir değer yok (fonksiyon değer döndürmüyor olabilir).');
  if(Array.isArray(v))throw RE('Bir dizinin tamamı "'+name+'" değişkenine atanamaz.');
  if((type==='Integer')&&typeof v==='number')return Math.trunc(v);
  if(type==='Real'&&typeof v==='number')return v;
  if(type==='String'&&typeof v==='string')return v;
  if(type==='Boolean'&&typeof v==='boolean')return v;
  throw RE('Tür uyumsuzluğu: '+TTR[type]+' türündeki "'+name+'" değişkenine '+typeName(v)+' değer ('+fmt(v)+') atanamaz.'+(type==='String'?' İpucu: ToString(...) kullanın.':(typeof v==='string'&&type!=='Boolean')?' İpucu: ToInteger(...) veya ToReal(...) kullanın.':''));
}
function parseInput(raw,type){
  const s=raw.trim();
  if(type==='Integer'){if(/^[-+]?\d+$/.test(s))return{ok:true,v:parseInt(s,10)};return{ok:false,m:'"'+raw+'" bir tamsayı değil. Lütfen tamsayı girin (ör. 42).'}}
  if(type==='Real'){const t=s.replace(',','.');if(/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t))return{ok:true,v:parseFloat(t)};return{ok:false,m:'"'+raw+'" bir sayı değil. Lütfen sayı girin (ör. 3.5).'}}
  if(type==='Boolean'){const l=s.toLocaleLowerCase('tr');if(['true','doğru','evet','d','1'].includes(l))return{ok:true,v:true};if(['false','yanlış','hayır','y','0'].includes(l))return{ok:true,v:false};return{ok:false,m:'Lütfen true veya false girin.'}}

}
function makeRunner(program,io){
  const fnMap={};program.functions.forEach(f=>fnMap[f.name.toLowerCase()]=f);

  function eq(x,y){if(typeof x!==typeof y)throw RE('Farklı türler karşılaştırılamaz: '+typeName(x)+' ve '+typeName(y)+'.');return x===y}
  function* ev(a,fr){
    switch(a.k){

      case 'par':return yield* ev(a.a,fr);
      case 'id':{if(fnMap[a.name.toLowerCase()]&&!fr.vars.has(a.name.toLowerCase()))throw RE('"'+a.name+'" bir fonksiyon; çağırmak için parantez kullanın: '+a.name+'(...)');
        const v=getVar(fr,a.name);if(v.isArr)return v.value;if(v.value===undefined)throw RE('"'+v.name+'" değişkenine henüz bir değer atanmadı.');return v.value}
      case 'idx':{const v=getVar(fr,a.name);if(!v.isArr)throw RE('"'+v.name+'" bir dizi değil, [ ] kullanılamaz.');const i=yield* ev(a.index,fr);checkIdx(v,i);const x=v.value[i];if(x===undefined)throw RE(v.name+'['+i+'] elemanına henüz değer atanmadı.');return x}
      case 'un':{const x=yield* ev(a.a,fr);if(a.op==='-'){needN('-',x);return -x}if(typeof x!=='boolean')throw RE('"not" işlemi Mantıksal değer bekler.');return !x}
      case 'bin':{
        const op=a.op;
        if(op==='and'||op==='or'){const x=yield* ev(a.a,fr);if(typeof x!=='boolean')throw RE('"'+op+'" işleminin iki yanı da Mantıksal (doğru/yanlış) olmalı.');if(op==='and'&&!x)return false;if(op==='or'&&x)return true;const y=yield* ev(a.b,fr);if(typeof y!=='boolean')throw RE('"'+op+'" işleminin iki yanı da Mantıksal (doğru/yanlış) olmalı.');return y}
        const x=yield* ev(a.a,fr),y=yield* ev(a.b,fr);

          case '%':needN('%',x,y);if(y===0)throw RE('Sıfıra göre mod alınamaz.');return x%y;
          case '^':needN('^',x,y);return Math.pow(x,y);

          while(true){const raw=yield{k:'input',name:n.variable,type:t.v.type};const r=parseInput(String(raw),t.v.type);if(r.ok){put(t,r.v);break}io.out(r.m,true,'err')}break}
        case 'output':{const val=yield* evalStr(n.expr,fr);if(Array.isArray(val))throw RE('Dizinin tamamı yazdırılamaz; elemanları tek tek yazdırın.');io.out(fmt(val),n.newline!==false);break}
        case 'if':{const c=yield* evalBool(n.expr,fr);yield* execList(c?n.then:n.else,fr);break}
        case 'while':{let first=true,g=0;while(true){if(!first)yield{k:'step',n};first=false;const c=yield* evalBool(n.expr,fr);if(!c)break;yield* execList(n.body,fr)}break}

          if(st<=0)throw RE('For döngüsünde adım değeri pozitif olmalı (azalan döngü için yönü "Azalan" seçin).');

          break}

      }

  }

    const m=program.functions.find(f=>f.name.toLowerCase()==='main')||program.functions[0];
    const fr=newFrame(m);yield* execList(m.body,fr);
  }
  return{gen:main(),frames};
}

const GAP=34,SH=44,DH=58;
let targets=[],nodeIx={};
function label(n){
  switch(n.t){
    case 'declare':return n.names?TTR[n.type]+(n.array?' dizi ':' ')+n.names+(n.array?'['+n.size+']':''):'';
    case 'assign':return n.variable||n.expr?n.variable+' = '+n.expr:'';
    case 'input':return n.variable?'Girdi '+n.variable:'';

function sizeList(list){let l=46,r=46,h=GAP;for(const n of list){const s=sizeNode(n);l=Math.max(l,s.l);r=Math.max(r,s.r);h+=s.h+GAP}return{l,r,h}}
function sizeNode(n){
  const lb=clip(label(n)||NAMES[n.t],420),w0=tw(lb);

    const w=Math.max(120,w0+(n.t==='input'||n.t==='output'?54:36));s={l:w/2,r:w/2,h:SH,w}}
  else if(n.t==='if'){
    const dw=Math.max(130,w0+70),L=sizeList(n.else),R=sizeList(n.then);

    s={dw,L,R,xL,xR,l:xL+L.l,r:xR+R.r,h:DH/2+Math.max(L.h,R.h)+16}}

    const hw=Math.max(130,w0+(n.t==='for'?52:70)),B=sizeList(n.body);

const ln=(pts,c='#4b5068',cls='')=>`<polyline ${cls?'class="'+cls+'"':''} points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>`;
const arrowHead=(x,y,dir='d',c='#4b5068')=>{const m={d:[[x-5,y-9],[x+5,y-9],[x,y]],r:[[x-9,y-5],[x-9,y+5],[x,y]],l:[[x+9,y-5],[x+9,y+5],[x,y]],u:[[x-5,y+9],[x+5,y+9],[x,y]]}[dir];return `<polygon points="${m.map(p=>p.join(',')).join(' ')}" fill="${c}"/>`};
const txt=(x,y,s,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-size="${o.fs||14}" font-weight="${o.fw||600}" fill="${o.c||'#1d2135'}"${o.it?' font-style="italic"':''} font-family="Inter, Arial, sans-serif">${esc(s)}</text>`;
function conn(cx,y1,y2,list,index,arrow){

}
function drawList(list,cx,y,lastArrow){

}
function shapeText(n,cx,cy){const has=!!label(n);return txt(cx,cy+5,n._s.lb,{c:has?(n.t==='comment'?'#555b70':'#1d2135'):'#9aa0b4',it:!has||n.t==='comment',fw:has&&n.t!=='comment'?600:500})}

      :`<polygon class="shp" points="${x+16},${y} ${x+hw-16},${y} ${x+hw},${ym} ${x+hw-16},${y+DH} ${x+16},${y+DH} ${x},${ym}" fill="${c.f}" stroke="${c.s}" stroke-width="2"/>`;

/* ================= Durum & render ================= */
let prog,curFn=0,selId=null,zoom=1,clipNode=null,undoS=[],redoS=[],run=null;
function render(){
  if(curFn>=prog.functions.length)curFn=0;

  $('#canvas').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(W*zoom)}" height="${Math.round(y*zoom)}" viewBox="0 0 ${W} ${y}" font-family="Inter, Arial, sans-serif">${s}</svg>`;
  applyMarks();renderTabs();renderSel();renderCode();
  $('#bUndo').disabled=!undoS.length;$('#bRedo').disabled=!redoS.length;$('#zl').textContent=Math.round(zoom*100)+'%';

  document.querySelectorAll('#canvas .node').forEach(g=>{const id=+g.dataset.n;g.classList.toggle('sel',id===selId);g.classList.toggle('active',!!run&&run.active===id);g.classList.toggle('err',!!run&&run.errId===id)});

    `<div class="ftab add" data-i="add" title="Yeni fonksiyon ekle">＋ Fonksiyon</div><input id="pname" title="Program adı" value="${esc(prog.name)}"><div id="selbar"></div>`;

const DELAYS=[1400,1000,700,480,320,200,120,60,20,0];

function stepOnce(send){
  let res;

  if(res.done){finish();return 'end'}
  const y=res.value;
  if(y.k==='input'){run.waiting=true;askInput(y);return 'input'}
  run.steps++;setActive(y.n.id);return 'step';
}
async function loop(){
  if(!run)return;const tok=run.token;
  while(run&&run.token===tok&&run.mode==='run'&&!run.waiting){
    const r=stepOnce();if(r!=='step')break;
    const d=DELAYS[$('#speed').value-1];
    if(d>0){renderVars();await new Promise(r=>setTimeout(r,d))}
    else if(run.steps%400===0){renderVars();await new Promise(r=>setTimeout(r,0))}
  }

}

/* ================= Kod üretimi ================= */
const PREC={or:1,and:2,not:3,'==':4,'!=':4,'<':4,'>':4,'<=':4,'>=':4,'&':5,'+':6,'-':6,'*':7,'/':7,'%':7,neg:8,'^':9};
function genE(src,L){try{return genA(parseExpr(src),0,L)}catch(e){return src||'?'}}
function genA(a,pp,L){
  const py=L==='py';let s,p=10;
  switch(a.k){
    case 'num':return a.raw; case 'str':return JSON.stringify(a.v); case 'bool':return py?(a.v?'True':'False'):String(a.v);
    case 'pi':return py?'math.pi':'Math.PI'; case 'id':return a.name; case 'idx':return a.name+'['+genA(a.index,0,L)+']';
    case 'par':return genA(a.a,pp,L);
    case 'call':return genCall(a,L);
    case 'un':if(a.op==='not'){p=3;s=(py?'not ':'!')+genA(a.a,py?3:8,L)}else{p=8;s='-'+genA(a.a,8,L)}break;
    case 'bin':{p=PREC[a.op];
      if(a.op==='&'){p=6;const f=x=>(x.k==='str'||(x.k==='bin'&&x.op==='&')||(x.k==='par'&&x.a.k==='bin'&&x.a.op==='&'))?genA(x,6,L):(py?'str('+genA(x,0,L)+')':(x.k==='bin'?'String('+genA(x,0,L)+')':genA(x,7,L)));
        s=f(a.a)+' + '+f(a.b);if(!py&&a.a.k!=='str'&&a.b.k!=='str'&&!(a.a.k==='bin'&&a.a.op==='&'))s='String('+genA(a.a,0,L)+') + '+f(a.b);break}
      if(a.op==='^'&&!py){s='Math.pow('+genA(a.a,0,L)+', '+genA(a.b,0,L)+')';p=10;break}
      const m=py?{'^':'**'}:{and:'&&',or:'||','==':'===','!=':'!=='};const o=m[a.op]||a.op;
      s=genA(a.a,a.op==='^'?p+1:p,L)+' '+o+' '+genA(a.b,a.op==='^'?p:p+1,L)}
  }
  return p<pp?'('+s+')':s;
}
function genCall(a,L){
  const k=a.name.toLowerCase(),A=a.args.map(x=>genA(x,0,L)),py=L==='py';
  if(!BI[k])return a.name+'('+A.join(', ')+')';
  if(py){
    const m={abs:'abs',sqrt:'math.sqrt',sin:'math.sin',cos:'math.cos',tan:'math.tan',arcsin:'math.asin',arccos:'math.acos',arctan:'math.atan',ln:'math.log',log:'math.log',log10:'math.log10',int:'int',len:'len',size:'len',tostring:'str',tointeger:'int',toreal:'float',tochar:'chr',tocode:'ord'};
    if(m[k])return m[k]+'('+A.join(', ')+')';
    if(k==='random')return 'random.randrange('+A[0]+')';
    if(k==='char')return genA(a.args[0],10,L)+'['+A[1]+']';
    if(k==='sgn')return '((' +A[0]+') > 0) - (('+A[0]+') < 0)';
    if(k==='tofixed')return 'format('+A[0]+', ".'+(a.args[1].k==='num'?A[1]:'" + str('+A[1]+') + "')+'f")';
  }else{
    const m={abs:'Math.abs',sqrt:'Math.sqrt',sin:'Math.sin',cos:'Math.cos',tan:'Math.tan',arcsin:'Math.asin',arccos:'Math.acos',arctan:'Math.atan',ln:'Math.log',log:'Math.log',log10:'Math.log10',int:'Math.trunc',sgn:'Math.sign',tostring:'String',tointeger:'parseInt',toreal:'parseFloat',tochar:'String.fromCharCode'};
    if(m[k])return m[k]+'('+A.join(', ')+')';
    if(k==='random')return 'Math.floor(Math.random() * '+genA(a.args[0],7,L)+')';
    if(k==='len'||k==='size')return genA(a.args[0],10,L)+'.length';
    if(k==='char')return genA(a.args[0],10,L)+'['+A[1]+']';
    if(k==='tocode')return genA(a.args[0],10,L)+'.charCodeAt(0)';
    if(k==='tofixed')return genA(a.args[0],10,L)+'.toFixed('+A[1]+')';
  }
  return a.name+'('+A.join(', ')+')';
}
function varTypes(f){const m={};f.params.forEach(p=>m[p.name.toLowerCase()]=p.type);const w=l=>l.forEach(n=>{if(n.t==='declare')splitNames(n.names).forEach(x=>m[x.toLowerCase()]=n.type);kids(n).forEach(w)});w(f.body);return m}
const baseName=v=>String(v).split('[')[0].trim().toLowerCase();
const DEF={py:{Integer:'0',Real:'0.0',String:'""',Boolean:'False'},js:{Integer:'0',Real:'0',String:'""',Boolean:'false'}};
function genPy(){
  const out=['import math','import random',''];
  const fs=[...prog.functions].sort((a,b)=>(a.name.toLowerCase()==='main')-(b.name.toLowerCase()==='main'));
  for(const f of fs){
    const isMain=f.name.toLowerCase()==='main',ty=varTypes(f);
    out.push('def '+(isMain?'main':f.name)+'('+f.params.map(p=>p.name).join(', ')+'):');
    const blk=(list,ind)=>{let any=false;for(const n of list){const I='    '.repeat(ind);any=true;
      switch(n.t){

        case 'do':out.push(I+'while True:');blk(n.body,ind+1);out.push(I+'    if not ('+genE(n.expr,'py')+'):');out.push(I+'        break');break;
        case 'call':out.push(I+genE(n.expr,'py'));break;
        case 'comment':out.push(I+'# '+n.text.replace(/\n/g,' '));any=list.some(x=>x.t!=='comment');break;

function dat(n){const o=n%10,t=Math.floor(n/10)%10;if(o)return n+{1:"'e",2:"'ye",3:"'e",4:"'e",5:"'e",6:"'ya",7:"'ye",8:"'e",9:"'a"}[o];if(t)return n+{1:"'a",2:"'ye",3:"'a",4:"'a",5:"'ye",6:"'a",7:"'e",8:"'e",9:"'a"}[t];return n+"'e"}
function genSteps(){

  for(const f of prog.functions){
    const isMain=f.name.toLowerCase()==='main',ins=[];
    const L=()=>({pos:null}),mark=l=>{l.pos=ins.length},go=l=>()=>'Adım '+dat(l.pos+1)+' git';
    const E=t=>ins.push(typeof t==='function'?t:()=>t);
    E('Başla');
    if(!isMain&&f.params.length)E('Parametreleri al: '+f.params.map(p=>p.name).join(', '));
    const blk=list=>{for(const n of list){
      switch(n.t){
        case 'declare':E(n.names+' adlı '+TTR[n.type]+(n.array?' dizisini ('+n.size+' elemanlı)':' değişkenleri')+' tanımla');break;
        case 'assign':E(n.variable+' ← '+n.expr);break;
        case 'input':E(n.variable+' değerini kullanıcıdan al (oku)');break;
        case 'output':E('Ekrana yaz: '+n.expr);break;
        case 'if':{const le=L(),lend=L();const hasElse=n.else.some(x=>x.t!=='comment');E(()=>'Eğer '+n.expr+' değilse '+go(hasElse?le:lend)());blk(n.then);if(hasElse){E(go(lend));mark(le);blk(n.else)}mark(lend);break}
        case 'while':{const top=L(),end=L();mark(top);E(()=>'Eğer '+n.expr+' değilse '+go(end)());blk(n.body);E(go(top));mark(end);break}
        case 'for':{const top=L(),end=L(),st=n.step||'1';E(n.variable+' ← '+n.start);mark(top);E(()=>'Eğer '+n.variable+(n.dir==='dec'?' < ':' > ')+n.end+' ise '+go(end)());blk(n.body);E(n.variable+' ← '+n.variable+(n.dir==='dec'?' - ':' + ')+st);E(go(top));mark(end);break}
        case 'do':{const top=L();mark(top);blk(n.body);E(()=>'Eğer '+n.expr+' ise '+go(top)());break}
        case 'call':E(n.expr+' alt programını çalıştır');break;
      }}};
    blk(f.body);
    if(f.type&&f.type!=='None')E('Sonuç olarak '+f.variable+' değerini döndür');
    E('Bitir');
    res.push((isMain?'ALGORİTMA: '+(prog.name||'Program'):'FONKSİYON: '+f.name)+'\n'+ins.map((fn,i)=>'Adım '+(i+1)+': '+fn()).join('\n'));
  }
  return res.join('\n\n');
}
function hl(code,lang){
  let h=esc(code);
  h=h.replace(/(&quot;.*?&quot;)/g,'<span class="s">$1</span>');
  if(lang==='py')h=h.replace(/(^|\n)(\s*)(#.*)/g,'$1$2<span class="c">$3</span>').replace(/\b(def|if|else|elif|while|for|in|range|return|import|and|or|not|True|False|break|pass|print|input)\b/g,'<span class="k">$1</span>');
  else if(lang==='js')h=h.replace(/(^|\n)(\s*)(\/\/.*)/g,'$1$2<span class="c">$3</span>').replace(/\b(function|let|if|else|while|for|do|return|true|false)\b/g,'<span class="k">$1</span>');
  else if(lang==='pseudo')h=h.replace(/(^|\n)(\s*)(\/\/.*)/g,'$1$2<span class="c">$3</span>').replace(/(ALGORİTMA|FONKSİYON|BAŞLA|BİTİR|TANIMLA|OKU|YAZ|EĞER SONU|EĞER|İSE|DEĞİLSE|İKEN SONU|İKEN|İÇİN SONU|İÇİN|TEKRARLA|DEVAM ET|ÇAĞIR|DÖNDÜR|DEN|E KADAR|ARTIR|AZALT)/g,'<span class="k">$1</span>');
  else h=h.replace(/(Adım \d+:)/g,'<span class="n">$1</span>').replace(/(ALGORİTMA:|FONKSİYON:)/g,'<span class="k">$1</span>');
  return h;
}

function toFprg(){
  const X=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const B=b=>b?'True':'False';
  const N=(n,i)=>{const p=' '.repeat(i);switch(n.t){
    case 'declare':return `${p}<declare name="${X(n.names)}" type="${n.type}" array="${B(n.array)}" size="${X(n.size)}"/>\n`;
    case 'assign':return `${p}<assign variable="${X(n.variable)}" expression="${X(n.expr)}"/>\n`;
    case 'input':return `${p}<input variable="${X(n.variable)}"/>\n`;
    case 'output':return `${p}<output expression="${X(n.expr)}" newline="${B(n.newline!==false)}"/>\n`;
    case 'if':return `${p}<if expression="${X(n.expr)}">\n${p}    <then>\n${Ls(n.then,i+8)}${p}    </then>\n${p}    <else>\n${Ls(n.else,i+8)}${p}    </else>\n${p}</if>\n`;
    case 'while':return `${p}<while expression="${X(n.expr)}">\n${Ls(n.body,i+4)}${p}</while>\n`;
    case 'for':return `${p}<for variable="${X(n.variable)}" start="${X(n.start)}" end="${X(n.end)}" direction="${n.dir==='dec'?'dec':'inc'}" step="${X(n.step||'1')}">\n${Ls(n.body,i+4)}${p}</for>\n`;
    case 'do':return `${p}<do expression="${X(n.expr)}">\n${Ls(n.body,i+4)}${p}</do>\n`;
    case 'call':return `${p}<call expression="${X(n.expr)}"/>\n`;
    case 'comment':return `${p}<comment text="${X(n.text)}"/>\n`;}return ''};
  const Ls=(l,i)=>l.map(n=>N(n,i)).join('');
  let s=`<?xml version="1.0"?>\n<flowgorithm fileversion="4.2">\n    <attributes>\n        <attribute name="name" value="${X(prog.name)}"/>\n        <attribute name="authors" value="${X(prog.author||'')}"/>\n        <attribute name="about" value="AkışLab · sunays.school"/>\n    </attributes>\n`;
  for(const f of prog.functions){
    s+=`    <function name="${X(f.name)}" type="${f.type||'None'}" variable="${X(f.variable||'')}">\n        <parameters>\n${f.params.map(p=>`            <parameter name="${X(p.name)}" type="${p.type}" array="${B(p.array)}"/>\n`).join('')}        </parameters>\n        <body>\n${Ls(f.body,12)}        </body>\n    </function>\n`;
  }
  return s+'</flowgorithm>\n';
}
function fromFprg(xml){
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.querySelector('parsererror'))throw new Error('Dosya okunamadı (XML hatası).');
  const root=doc.documentElement;if(root.nodeName!=='flowgorithm')throw new Error('Bu bir Flowgorithm (.fprg) dosyası değil.');
  const ch=(el,name)=>[...el.children].filter(c=>c.nodeName===name);
  const T=t=>{const m={integer:'Integer',real:'Real',string:'String',boolean:'Boolean',none:'None'};return m[String(t||'').toLowerCase()]||'Integer'};
  const p={name:'Program',author:'',functions:[]};
  for(const at of ch(root,'attributes').flatMap(a=>ch(a,'attribute'))){if(at.getAttribute('name')==='name')p.name=at.getAttribute('value')||'Program';if(at.getAttribute('name')==='authors')p.author=at.getAttribute('value')||''}
  const PL=el=>el?[...el.children].map(PE).filter(Boolean):[];
  const PE=c=>{const a=k=>c.getAttribute(k)??'';switch(c.nodeName){
    case 'declare':return{t:'declare',names:a('name'),type:T(a('type')),array:a('array').toLowerCase()==='true',size:a('size')};
    case 'assign':return{t:'assign',variable:a('variable'),expr:a('expression')};
    case 'input':return{t:'input',variable:a('variable')};
    case 'output':return{t:'output',expr:a('expression'),newline:a('newline').toLowerCase()!=='false'};
    case 'if':return{t:'if',expr:a('expression'),then:PL(ch(c,'then')[0]),else:PL(ch(c,'else')[0])};
    case 'while':return{t:'while',expr:a('expression'),body:PL(c)};
    case 'for':return{t:'for',variable:a('variable'),start:a('start'),end:a('end'),dir:a('direction').toLowerCase()==='dec'?'dec':'inc',step:a('step')||'1',body:PL(c)};
    case 'do':return{t:'do',expr:a('expression'),body:PL(c)};
    case 'call':return{t:'call',expr:a('expression')};
    case 'comment':return{t:'comment',text:a('text')};}return null};
  for(const fe of ch(root,'function')){
    const f={name:fe.getAttribute('name')||'Main',type:T(fe.getAttribute('type')||'None'),variable:fe.getAttribute('variable')||'',params:[],body:[]};
    for(const pe of ch(fe,'parameters').flatMap(x=>ch(x,'parameter')))f.params.push({name:pe.getAttribute('name'),type:T(pe.getAttribute('type')),array:(pe.getAttribute('array')||'').toLowerCase()==='true'});
    f.body=PL(ch(fe,'body')[0]);p.functions.push(f);
  }
  if(!p.functions.length)throw new Error('Dosyada fonksiyon bulunamadı.');
  return p;
}

let solved={};try{solved=JSON.parse(store.get('akislab.solved')||'{}')}catch(e){}
let openTask=null;
const norm=s=>String(s).toLocaleLowerCase('tr').replace(/[çğıöşü]/g,m=>({ç:'c',ğ:'g',ı:'i',ö:'o',ş:'s',ü:'u'}[m]));
function findTok(out,tok,from){
  let i=from;
  while((i=out.indexOf(tok,i))!==-1){const b=out[i-1]||' ',a=out[i+tok.length]||' ';
    const numeric=/^-?\d/.test(tok);
    if(!/[a-z0-9]/.test(b)&&!(b==='-'&&numeric)&&(!numeric||(!/[a-z0-9]/.test(a)&&!(a==='.'&&/\d/.test(out[i+tok.length+1]||'')))))return i+tok.length;i++}
  return -1;
}
function runHeadless(inputs){
  let out='';const R=makeRunner(prog,{out:(t,nl)=>{out+=t+(nl?'\n':' ')}});const q=[...inputs];let send,steps=0;
  try{while(true){const r=R.gen.next(send);send=undefined;if(r.done)break;if(r.value.k==='input'){if(!q.length)return{out,err:'Program beklenenden fazla girdi istedi.'};send=String(q.shift())}if(++steps>300000)return{out,err:'Program çok uzun sürdü (sonsuz döngü olabilir).'}}}
  catch(e){return{out,err:e.message}}
  return{out};
}
function testTask(t){
  const res=t.tests.map(ts=>{const r=runHeadless(ts.in);if(r.err)return{ok:false,ts,r};const o=norm(r.out);let pos=0,ok=true;
    for(const e of ts.exp){const p=findTok(o,norm(e),pos);if(p<0){ok=false;break}pos=p}
    if(ok&&ts.no)for(const n of ts.no)if(findTok(o,norm(n),0)>=0)ok=false;return{ok,ts,r}});
  const all=res.every(x=>x.ok);if(all){solved[t.id]=true;store.set('akislab.solved',JSON.stringify(solved))}
  renderTasks();
  const trEl=$('#tr_'+t.id);if(trEl)trEl.innerHTML=(all?'<div class="p">🎉 Tebrikler! Tüm testler geçti.</div>':'')+res.map((x,i)=>`<div class="${x.ok?'p':'f'}">${x.ok?'✔':'✘'} Test ${i+1} · Girdi: <b>${x.ts.in.length?esc(x.ts.in.join(', ')):'—'}</b> · Beklenen: <b>${esc(x.ts.exp.join(' '))}</b>${x.ok?'':'<br>'+(x.r.err?'Hata: '+esc(x.r.err):'Çıktınız: <b>'+esc(x.r.out.trim().slice(0,160)||'(boş)')+'</b>')}</div>`).join('');
}
let tFilt={cat:'Tümü',lv:'Tümü',open:false};
function renderTasks(){
  const n=TASKS.filter(t=>solved[t.id]).length;
  const cats=['Tümü','Temel','Karar','Döngü','Dizi','Metin','Fonksiyon'],lvs=['Tümü','Kolay','Orta','Zor'];
  const cnt=c=>c==='Tümü'?TASKS.length:TASKS.filter(t=>t.cat===c).length;
  const chip=(k,v,lbl)=>`<button class="tchip${tFilt[k]===v?' on':''}" data-f="${k}" data-v="${v}">${lbl}</button>`;
  const list=TASKS.map((t,i)=>({t,i})).filter(({t})=>(tFilt.cat==='Tümü'||t.cat===tFilt.cat)&&(tFilt.lv==='Tümü'||t.lv===tFilt.lv)&&(!tFilt.open||!solved[t.id]));
  $('#tasks').innerHTML=`<style>.tchips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.tchip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:#444a63}.tchip:hover{border-color:var(--acc)}.tchip.on{background:var(--acc);border-color:var(--acc);color:#fff}.task h4 .no{color:var(--mut);font-weight:700;font-size:12px;min-width:26px}.task h4 .ct{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:#eefaf9;color:#0d9488}.task h4 .lv.Kolay{background:#e8f8ee;color:#15803d}.task h4 .lv.Zor{background:#fdecef;color:#be123c}</style>
  <div style="font-weight:700;font-size:14px">Görevler <span style="float:right;color:var(--mut);font-weight:600">${n} / ${TASKS.length} çözüldü</span></div><div class="prog"><div style="width:${n/TASKS.length*100}%"></div></div>
  <div style="font-size:12.5px;color:var(--mut);margin-bottom:10px">Bir görev seçin, akış diyagramınızı oluşturun ve <b>Test Et</b>'e basın. Programınız farklı girdilerle otomatik olarak denenir.</div>
  <div class="tchips">${cats.map(c=>chip('cat',c,c+' <span style="opacity:.6">'+cnt(c)+'</span>')).join('')}</div>
  <div class="tchips" style="margin-bottom:12px">${lvs.map(l=>chip('lv',l,l)).join('')}<button class="tchip${tFilt.open?' on':''}" data-f="open">Çözülmemişler</button></div>`+
  (list.length?'':'<div class="empty">Bu filtrede görev yok. 🎉</div>')+
  list.map(({t,i})=>`<div class="task${openTask===t.id?' on':''}" data-t="${t.id}"><h4><span class="no">${i+1}.</span>${esc(t.title)}<span class="lv ${t.lv}">${t.lv}</span><span class="ct">${t.cat}</span>${solved[t.id]?'<span class="done">✔</span>':''}</h4>
    <div class="tb2">${t.desc}<div class="hintx">💡 ${esc(t.hint)}</div><div style="display:flex;gap:6px"><button class="btn pri" data-test="${t.id}">Test Et</button><button class="btn" data-blank="${t.id}">Boş sayfada başla</button></div><div class="tres" id="tr_${t.id}"></div></div></div>`).join('');
}
$('#tasks').addEventListener('click',e=>{
  const tb=e.target.closest('[data-test]');if(tb){stopRun(true);testTask(TASKS.find(t=>t.id===tb.dataset.test));return}
  const bb=e.target.closest('[data-blank]');if(bb){const t=TASKS.find(x=>x.id===bb.dataset.blank);pushUndo();loadProg(emptyProgram());prog.name=t.title;render();toast('Boş sayfa açıldı (Ctrl+Z ile önceki programa dönebilirsiniz).');return}
  const fb=e.target.closest('[data-f]');if(fb){if(fb.dataset.f==='open')tFilt.open=!tFilt.open;else tFilt[fb.dataset.f]=fb.dataset.v;renderTasks();return}
  if(e.target.closest('.tb2'))return;
  const c=e.target.closest('.task');if(c){openTask=openTask===c.dataset.t?null:c.dataset.t;renderTasks()}
});

/* ================= Olaylar ================= */
$('#canvas').addEventListener('click',e=>{
  const c=e.target.closest('.conn');if(c){e.stopPropagation();openMenu(+c.dataset.t,e.clientX,e.clientY);return}
  const n=e.target.closest('.node');if(n){select(+n.dataset.n);return}
  select(null);
});
$('#canvasWrap').addEventListener('click',e=>{if(e.target.id==='canvasWrap'||e.target.id==='canvas')select(null)});
$('#canvas').addEventListener('dblclick',e=>{
  const n=e.target.closest('.node');if(n&&nodeIx[n.dataset.n]){openEdit(nodeIx[n.dataset.n].node,false);return}
  if(e.target.closest('.term'))openFnDialog(curFn);
});
$('#fnbar').addEventListener('click',e=>{
  const sb=e.target.closest('#selbar button');if(sb){const a=sb.dataset.a;if(a==='edit'&&nodeIx[selId])openEdit(nodeIx[selId].node,false);if(a==='del')delSel();if(a==='copy')copySel(false);if(a==='cut')copySel(true);return}
  const t=e.target.closest('.ftab');if(!t)return;if(t.dataset.i==='add'){openFnDialog(null);return}
  curFn=+t.dataset.i;selId=null;render();
});
$('#fnbar').addEventListener('dblclick',e=>{const t=e.target.closest('.ftab');if(t&&t.dataset.i!=='add')openFnDialog(+t.dataset.i)});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{showPane(b.dataset.p);if(b.dataset.p==='pCode')renderCode();if(b.dataset.p==='pTask')renderTasks()});
$('#codeSel').onchange=()=>{store.set('akislab.code',$('#codeSel').value);renderCode()};
$('#bCopy').onclick=async()=>{try{await navigator.clipboard.writeText(codeText());toast('Kod kopyalandı!')}catch(e){const r=document.createRange();r.selectNodeContents($('#code'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Kod seçildi, Ctrl+C ile kopyalayın.')}};
$('#bNew').onclick=()=>{pushUndo();loadProg(emptyProgram());render();conClear();toast('Yeni program. Önceki programa dönmek için Ctrl+Z.')};
$('#bOpen').onclick=()=>$('#file').click();
$('#bSave').onclick=saveFprg;
$('#bPng').onclick=exportPng;
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
$('#bRun').onclick=doRun;$('#bStep').onclick=doStep;
$('#bPause').onclick=()=>{if(run&&!run.done){run.mode='pause';updateRunBtns()}};
$('#bStop').onclick=()=>stopRun(false);
const setZoom=z=>{zoom=Math.max(.4,Math.min(2,Math.round(z*10)/10));render()};
$('#bZi').onclick=()=>setZoom(zoom+.1);$('#bZo').onclick=()=>setZoom(zoom-.1);
$('#canvasWrap').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(zoom+(e.deltaY<0?.1:-.1))}},{passive:false});
$('#speed').onchange=()=>store.set('akislab.speed',$('#speed').value);
document.addEventListener('keydown',e=>{
  if($('#modal').classList.contains('on'))return;
  const tag=e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(e.key==='F5'){e.preventDefault();doRun()}
  else if(e.key==='F10'){e.preventDefault();doStep()}
  else if(e.key==='Delete'||e.key==='Backspace'){if(selId){e.preventDefault();delSel()}}
  else if(c&&k==='z'&&!e.shiftKey){e.preventDefault();undo()}
  else if(c&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();redo()}
  else if(c&&k==='c')copySel(false);
  else if(c&&k==='x')copySel(true);
  else if(c&&k==='v'&&clipNode&&selId&&nodeIx[selId]){e.preventDefault();const {node,list}=nodeIx[selId];pushUndo();const n=cloneNode(clipNode);list.splice(list.indexOf(node)+1,0,n);selId=n.id;render()}
  else if(e.key==='Enter'&&selId&&nodeIx[selId])openEdit(nodeIx[selId].node,false);
  else if(e.key==='Escape'){closeMenu();select(null)}
});

/* ================= Başlat ================= */
(function init(){
  let p=null;try{const s=store.get('akislab.prog');if(s)p=JSON.parse(s)}catch(e){}
  if(!p||!p.functions||!p.functions.length)p=EXAMPLES[1][2]();
  loadProg(p);
  const sp=store.get('akislab.speed');if(sp)$('#speed').value=sp;
  const cs=store.get('akislab.code');if(cs)$('#codeSel').value=cs;
  render();updateRunBtns();renderTasks();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render());
})();
</script>
