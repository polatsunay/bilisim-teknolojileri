];
var KEY='cs-5bt-v1';
var st={}; try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function tbl(r){return '<div class="scroll"><table><tr>'+r[0].map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr>'+r.slice(1).map(function(x){return '<tr>'+x.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}
function renderK(){

  h+='<section class="sheet check topic"><h2>Hızlı tekrar</h2>'+['Bilgi, iletişim, teknolojiyi tanımlayıp örneklendirebilirim.','Cihazları gelişim sırasına dizebilir, ENIAC\'ı anlatabilirim.','Kullanım alanlarına örnek verebilirim.','Basit/karmaşık problemi ayırır, girdi-işlem-çıktıyı yazabilirim.','Algoritma yapılarını bilir, algoritmayı izleyebilirim.'].map(function(t,i){return '<label><input type="checkbox" id="chk'+i+'" data-chk="'+i+'"'+(st['c'+i]?' checked':'')+'> '+t+'</label>'}).join('')+'</section>';
  document.getElementById('konu').innerHTML=h;
}
function renderQ(){
  var h='<div class="dots" id="dots" role="group" aria-label="Soru haritası"></div>'+Q.map(function(q){
    var s='<section class="sheet qs" data-k="'+q.kz+'" data-i="'+(q.no-1)+'" hidden id="q'+q.no+'"><div class="qh"><span class="qno">'+q.no+'.</span><span class="kaz">['+q.kaz+']</span><span class="pt">'+q.p+' puan</span></div>';
    if(q.intro)s+='<p class="intro">'+q.intro+'</p>';
    if(q.code)s+='<pre>'+esc(q.code)+'</pre>';if(q.dtbl)s+='<div class="qdata">'+tbl(q.dtbl)+'</div>';
    q.parts.forEach(function(p,i){
      var id=q.no+'-'+i;
      s+='<div class="part"><p class="q">'+p.q+'</p><textarea id="ta'+id+'" data-id="'+id+'" placeholder="Cevabını buraya yaz..." aria-label="Cevap '+id+'">'+esc(st['a'+id]||'')+'</textarea>';
      s+='<div class="row"><button class="btn fill" data-chk2="'+id+'">Cevabı kontrol et</button><span class="warn" id="w'+id+'" role="alert"></span></div><div id="an'+id+'" hidden class="ans"><b>Örnek cevap</b>';
      if(p.tbl)s+=tbl(p.tbl);
      if(p.ans)s+=p.ans.length>1?'<ul>'+p.ans.map(function(a){return '<li>'+a+'</li>'}).join('')+'</ul>':p.ans[0];
      if(p.after)s+='<p style="margin:6px 0 0">'+p.after+'</p>';
      s+='</div></div>';
    });
    s+='<div class="mark"><span>Bu soruyu değerlendir:</span>'+[['1','Tam doğru'],['0.5','Kısmen'],['0','Tekrar çalış']].map(function(m){return '<button data-mark="'+q.no+'" data-v="'+m[0]+'" aria-pressed="'+(String(st['m'+q.no])===m[0])+'">'+m[1]+'</button>'}).join('')+'</div><div class="row"><button class="btn fill" data-next="'+q.no+'">'+(q.no<Q.length?'Sonraki soru →':'Bitir ve sonucu gör')+'</button><span class="warn" id="wn'+q.no+'" role="alert"></span></div></section>';
    return s}).join('');
  h+='<div id="fin" hidden><section class="sheet"><div class="total" id="total"></div><p class="sub" style="margin:4px 0 12px">Puan, cevapların kitaptaki örnek cevaplarla otomatik karşılaştırılarak hesaplanır; öğretmen ayrıca kontrol edebilir.</p><div class="row"><button class="btn" id="reset">Yazdıklarımı sil</button></div></section>';
  h+='<section class="sheet" id="sendbox" hidden><h2 style="font-family:var(--display);font-size:20px;margin:0 0 6px;color:var(--navy)">Cevaplarımı öğretmene gönder</h2><p class="sub" style="margin:0 0 10px">Yazdığın cevaplar ve kendi puanın öğretmen ekranına düşer. İstediğin kadar tekrar gönderebilirsin; son gönderim geçerlidir.</p><label for="stname" style="font-weight:600">Adın soyadın ve sınıfın</label><input id="stname" type="text" maxlength="60" placeholder="Örn. Ayşe Yılmaz 9-A" style="width:100%;font:16px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:4px 0 10px"><div class="row" style="margin-top:0"><button class="btn fill" id="send">Gönder</button><span id="sendmsg" role="status" class="sub" style="margin:0"></span></div></section></div>';
  document.getElementById('soru').innerHTML=h;

function score(){
  var t=0,n=0;Q.forEach(function(q){var v=st['m'+q.no];if(v!==undefined){t+=q.p*Number(v);n++}});
  var txt=n?(Math.round(t*2)/2)+' / 100 puan ('+n+'/'+Q.length+' soru değerlendirildi)':'';
  var el=document.getElementById('total');if(el)el.textContent=n?txt:'Cevaplarını kontrol ettikçe puanın burada görünür.';
  document.getElementById('navscore').textContent=n?(Math.round(t*2)/2)+' / 100':'';
}
function tab(n){

  window.scrollTo(0,0);
}
document.addEventListener('click',function(e){

document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.id){st['a'+t.dataset.id]=t.value;save()}});

var CUR=0,TEACH=false;
function doneQ(q){return q.parts.every(function(p,i){return st['v'+q.no+'-'+i]})}
function firstOpen(){for(var i=0;i<Q.length;i++)if(!doneQ(Q[i]))return i;return Q.length}
function allowed(){return Q.length}
function tr(s){return String(s).replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase()}
function plain(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent||''}
function ansText(p){var t=(p.ans||[]).join(' ');(p.tbl||[]).forEach(function(r,i){if(i)t+=' '+r.join(' ')});return plain(t)}
var STOP={'bir':1,'bu':1,'ile':1,'için':1,'icin':1,'ama':1,'gibi':1,'olan':1,'daha':1,'çok':1,'cok':1,'veya':1,'her':1,'ben':1,'sen':1,'nin':1,'nın':1,'mi':1,'mı':1,'ne':1,'de':1,'da':1,'ki':1,'ve':1,'o':1};
function toks(s){return tr(s).replace(/[^a-zçğıöşü0-9]+/g,' ').split(' ').filter(function(w){return w&&!STOP[w]})}
function stem(w){return w.length>4?w.slice(0,4):w}
function check(txt,q,p){
  var t=txt.trim();
  if(!t)return 'Önce cevabını yaz, sonra kontrol et. İstersen bu soruyu atlayıp başka soruya geçebilirsin.';
  var ref=ansText(p),need=Math.min(12,Math.max(2,Math.floor(ref.length*0.4)));
  var letters=(t.match(/[A-Za-zÇĞİÖŞÜçğıöşü0-9]/g)||[]).length;
  if(t.length<need||letters<Math.min(2,need))return 'Cevabın çok kısa. Soruyu kendi cümlelerinle yaz.';
  var code=/[=()\[\]{}"#*\/%<>:;]/.test(t);
  var flat=tr(t).replace(/[^a-zçğıöşü]/g,'');
  if(!code){
    if(/([^\d\s])\1{3,}/.test(t)||/(.{2,3})\1{2,}/.test(flat))return 'Bu anlamlı bir cevap gibi görünmüyor. Gerçek bir cevap yaz.';
    var ws=flat?tr(t).split(/[^a-zçğıöşü]+/).filter(function(w){return w.length>=4}):[];
    var bad=ws.filter(function(w){var v=(w.match(/[aeıioöuü]/g)||[]).length;return v/w.length<0.2||v/w.length>0.8}).length;
    if(ws.length&&bad*2>=ws.length)return 'Bu anlamlı bir cevap gibi görünmüyor. Gerçek bir cevap yaz.';
  }
  var refS={};toks(ref+' '+p.q+' '+(q.intro||'')+' '+(q.code||'')).forEach(function(w){refS[stem(w)]=1});
  var ok=toks(t).some(function(w){return refS[stem(w)]});
  if(!ok)return 'Cevabın soruyla ilgili görünmüyor. Soruda geçen kavramları kullanarak yaz.';
  return '';
}
function renderDots(){
  var el=document.getElementById('dots');if(!el)return;var a=allowed();

  h+='<span class="dprog">'+Q.filter(doneQ).length+' / '+Q.length+' soru tamamlandı'+(TEACH?' · öğretmen: tüm sorular açık':'')+'</span>';
  el.innerHTML=h;
}
function showQ(i,scroll){
  var a=allowed();if(i>a)i=a;if(i<0)i=0;CUR=i;
  document.querySelectorAll('#soru .qs').forEach(function(x){x.hidden=Number(x.dataset.i)!==i});
  var fin=document.getElementById('fin');if(fin)fin.hidden=i<Q.length;

}
function reveal(id){
  var a=document.getElementById('an'+id),b=document.querySelector('[data-chk2="'+id+'"]'),ta=document.getElementById('ta'+id);
  if(a)a.hidden=false;if(b){b.textContent='Kontrol edildi';b.disabled=true}if(ta)ta.readOnly=true;
}
function restore(){
  Q.forEach(function(q){q.parts.forEach(function(p,i){if(st['v'+q.no+'-'+i])reveal(q.no+'-'+i)})});
  showQ(firstOpen(),false);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.go!==undefined){var i=Number(b.dataset.go);if(i>allowed()){var w=document.getElementById('dprog');b.title='Önce önceki soruları cevapla';return}showQ(i,true);return}
  if(b.dataset.chk2){
    var id=b.dataset.chk2,no=Number(id.split('-')[0]),pi=Number(id.split('-')[1]),q=Q[no-1],p=q.parts[pi];
    var ta=document.getElementById('ta'+id),w=document.getElementById('w'+id),msg=check(ta.value,q,p);
    if(msg&&!TEACH){w.textContent=msg;ta.focus();return}
    w.textContent='';st['v'+id]=1;save();reveal(id);renderDots();return}
  if(b.dataset.next){
    var qn=Number(b.dataset.next),qq=Q[qn-1],wn=document.getElementById('wn'+qn);
    
    wn.textContent='';showQ(qn,true)}
});
renderK();renderQ();
</script>
